name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      # actions pinned to full commit SHAs (supply-chain safety); full history so gitleaks can scan every commit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: harness (every check must catch its planted failure)
        run: python3 evals-harness/run.py
      - name: secrets scan
        run: plugins/agentic-resume/bin/ar-secrets .
      - name: no em or en dashes
        run: "! grep -rnP '[\\x{2013}\\x{2014}]' --exclude-dir=.git ."
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
